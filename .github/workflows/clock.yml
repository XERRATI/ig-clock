name: clock
on:
  workflow_dispatch:
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: kick trinity-bot
        run: |
          curl -s -X POST "https://api.github.com/repos/XERRATI/trinity-bot/actions/workflows/autopost.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" -d '{"ref":"main"}'
          echo "kicked trinity-bot at $(date -u +%H:%M)"
      - name: kick trivol-bot
        run: |
          curl -s -X POST "https://api.github.com/repos/XERRATI/trivol-bot/actions/workflows/autopost.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" -d '{"ref":"main"}'
          echo "kicked trivol-bot at $(date -u +%H:%M)"
      - name: kick network-bot (every 2h)
        run: |
          H=$(date -u +%H)
          if [ $((10#$H % 2)) -eq 0 ]; then
            curl -s -X POST "https://api.github.com/repos/XERRATI/network-bot/actions/workflows/engine.yml/dispatches" \
              -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
              -H "Accept: application/vnd.github+json" -d '{"ref":"main"}'
            echo "kicked network-bot at $(date -u +%H:%M)"
          else
            echo "odd hour — network-bot sleeps"
          fi
      - name: wait 59.5 min
        run: sleep 3570
      - name: kick self (hourly chain)
        run: |
          curl -s -X POST "https://api.github.com/repos/XERRATI/ig-clock/actions/workflows/clock.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" -d '{"ref":"main"}'
          echo "chained next hour at $(date -u +%H:%M)"
